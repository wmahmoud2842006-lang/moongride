<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoonGride — Lunar Landing Site Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #070b14;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 { font-size: 30px; margin-bottom: 10px; color: #ffffff; }
    p { color: #94a3b8; line-height: 1.7; margin-bottom: 22px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .box {
      background: #131c31;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
    }
    .box h3 { font-size: 15px; color: #e2e8f0; margin-bottom: 6px; }
    .box span { font-size: 13px; color: #94a3b8; }
    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #070b14;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover { background: #7dd3fc; }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #34d399;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">MOONGRID • LIVE WEB VIEW</div>
    <h1>MoonGride</h1>
    <p>
      منصة استعراض وتحليل مواقع الهبوط القمرية لمشروع MoonGride. تم تفعيل النسخة المباشرة عبر GitHub Pages وجاهزة للعرض والتطوير المستمر.
    </p>
    <div class="grid">
      <div class="box">
        <h3>استكشاف المواقع</h3>
        <span>معاينة إحداثيات ومناطق الهبوط القمرية.</span>
      </div>
      <div class="box">
        <h3>حالة النشر</h3>
        <span>متصل ومباشر عبر GitHub Pages.</span>
      </div>
    </div>
    <button class="btn" id="pingBtn">فحص جاهزية الواجهة</button>
    <div id="status"></div>
  </main>

  <script>
    document.getElementById("pingBtn").addEventListener("click", () => {
      document.getElementById("status").textContent = "الواجهة تعمل بنجاح وجاهزة للعرض المباشر.";
    });
  </script>
</body>
</html>
